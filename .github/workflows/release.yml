# Must stay named "Build Release": notify-satis.yml listens for it.
name: Build Release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    release:
        uses: bernskiold/.github/.github/workflows/wordpress-plugin-release.yml@main
        with:
            # The class files are lowercase in this plugin.
            version-files: |
                src/plugin.php
